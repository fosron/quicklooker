name: QuickLooker
options:
  bundleIdPrefix: com.fosron.quicklooker
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  QuickLooker:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: QuickLookCore
      - target: QuickLookExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fosron.quicklooker
        PRODUCT_NAME: QuickLooker
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: read-only

  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLookExtension
    dependencies:
      - target: QuickLookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fosron.quicklooker.preview
        PRODUCT_NAME: QuickLookExtension
        INFOPLIST_FILE: Sources/QuickLookExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/QuickLookExtension/QuickLookExtension.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  QuickLookCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Core
        excludes:
          - Resources
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: com.fosron.quicklooker.core
        PRODUCT_NAME: QuickLookCore
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Frameworks"
        INFOPLIST_FILE: Sources/Core/Resources/FrameworkInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ""

  QuickLookCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CoreTests
    dependencies:
      - target: QuickLookCore
    settings:
      base:
        MACH_O_TYPE: bundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fosron.quicklooker.coretests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  QuickLooker:
    build:
      targets:
        QuickLooker: all
        QuickLookExtension: all
        QuickLookCore: all
    run:
      config: Debug
      executable: QuickLooker
    test:
      config: Debug
      targets:
        - QuickLookCoreTests
